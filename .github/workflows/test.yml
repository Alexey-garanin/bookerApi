name: API Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests in Docker
        run: |
          echo "Docker creates an image based on the Dockerfile."
          docker build -t booker-api-tests .
          
          echo "Running tests inside a Docker container."
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/build/allure-results \
            booker-api-tests

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@v1.8
        with:
          allure_results: allure-results
          allure_report: allure-report
          gh_pages: gh-pages

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report
          retention-days: 7